version: 1
appendOnly: true
labels:
  - label: breaking-change
    title: "^[^:]+!:.*"
  - label: breaking-change
    body: "BREAKING CHANGE"
  - label: enhancement
    title: "^feat(\\(.+\\))?!?:.*"
  - label: bug
    title: "^fix(\\(.+\\))?!?:.*"
  - label: documentation
    title: "^docs(\\(.+\\))?!?:.*"
  - label: performance
    title: "^perf(\\(.+\\))?!?:.*"
  - label: ci
    title: "^ci(\\(.+\\))?!?:.*"
  - label: chore
    title: "^(chore|test|build|style|refactor)(\\(.+\\))?!?:.*"
  - label: backend
    files:
      - "^apps/api/.*"
  - label: frontend
    files:
      - "^apps/(erp|pdv)/.*"
  - label: domain
    files:
      - "^src/sabores/.*"
      - "^tests/.*"
      - "^utils/.*"
  - label: ci
    files:
      - "^\\.github/.*"
      - "^\\.pre-commit-config\\.yaml$"
      - "^SConstruct$"
  - label: documentation
    files:
      - "^docs/.*"
      - "^.*[.]md$"
