name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run repository hooks
        run: SKIP=cloudflare-format,cloudflare-eslint,cloudflare-typecheck,markdownlint uvx --from pre-commit==4.7.0 pre-commit run --all-files

      - name: Run Python tests
        run: uv run pytest

  cloudflare-app:
    name: Cloudflare app quality, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked dependencies
        working-directory: apps/cloudflare
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        working-directory: apps/cloudflare
        run: pnpm dlx markdownlint-cli2@0.23.3 --config ../../.markdownlint-cli2.yaml ../../README.md ../../docs/json-contract.md README.md

      - name: Lint
        working-directory: apps/cloudflare
        run: pnpm lint

      - name: Check formatting
        working-directory: apps/cloudflare
        run: pnpm format:check

      - name: Typecheck
        working-directory: apps/cloudflare
        run: pnpm typecheck

      - name: Test Worker runtime
        working-directory: apps/cloudflare
        run: pnpm test

      - name: Build Vite app and Worker
        working-directory: apps/cloudflare
        run: pnpm build
