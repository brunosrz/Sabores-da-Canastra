name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-utils:
    name: Python utilities and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Check repository configuration and Python lint
        run: >-
          SKIP=ui-format,ui-lint,erp-format,erp-lint,pdv-format,pdv-lint,api-format,api-lint,markdownlint
          uvx --from pre-commit==4.7.0 pre-commit run --all-files

      - name: Run Python tests
        run: uv run pytest

      - name: Validate workbook utility
        run: uv run sabores validar

  ui:
    name: Design system, tests and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint, typecheck and test shared UI
        run: |
          pnpm format:check:ui
          pnpm lint:ui
          pnpm typecheck:ui
          pnpm test:ui

  erp:
    name: ERP lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ERP formatting
        run: pnpm format:check:erp

      - name: Lint ERP
        run: pnpm lint:erp

      - name: Typecheck ERP
        run: pnpm typecheck:erp

      - name: Test ERP
        run: pnpm test:erp

      - name: Build ERP
        run: pnpm build:erp

  pdv:
    name: PDV lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check PDV formatting
        run: pnpm format:check:pdv

      - name: Lint PDV
        run: pnpm lint:pdv

      - name: Typecheck PDV
        run: pnpm typecheck:pdv

      - name: Test PDV
        run: pnpm test:pdv

      - name: Build PDV
        run: pnpm build:pdv

  pdv-sync-contract:
    name: Contrato compartilhado do PDV offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check:sync

      - name: Lint contract
        run: pnpm lint:sync

      - name: Typecheck contract
        run: pnpm typecheck:sync

      - name: Test operation hash and money rules
        run: pnpm test:sync

  api:
    name: API, Cloudflare bindings and local D1 migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API formatting
        run: pnpm format:check:api

      - name: Lint API
        run: pnpm lint:api

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Test API and Cloudflare bindings in Miniflare
        run: pnpm test:api

      - name: Apply D1 migrations locally
        run: |
          pnpm db:migrate:local
          pnpm db:migrate:local

      - name: Validate local D1 restore from private backup contract
        run: pnpm --filter @sabores/api db:restore:validate -- apps/api/test/fixtures/backup-validation.sql apps/api/test/fixtures/backup-validation.json

      - name: Build API Worker
        run: pnpm build:api

  documentation:
    name: Documentation lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false

      - name: Lint documentation
        run: pnpm lint:docs
