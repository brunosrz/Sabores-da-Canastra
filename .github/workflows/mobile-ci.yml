name: Validação mobile

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.app }} (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [erp, pdv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Preparar assets e sincronizar Capacitor
        run: pnpm --filter @sabores/${{ matrix.app }} mobile:sync:android
      - name: Compilar APK de teste
        working-directory: apps/${{ matrix.app }}/android
        run: bash gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-${{ matrix.app }}-debug
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS ${{ matrix.app }} (simulador)
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [erp, pdv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.11.2
          run_install: false
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Preparar assets e sincronizar Capacitor
        run: pnpm --filter @sabores/${{ matrix.app }} mobile:sync:ios
      - name: Compilar para simulador sem assinatura
        working-directory: apps/${{ matrix.app }}/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
