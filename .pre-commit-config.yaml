minimum_pre_commit_version: "4.7.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cloudflare-format
        name: cloudflare app formatting
        entry: pnpm --dir apps/cloudflare format:check
        language: system
        types_or: [javascript, jsx, ts, tsx, css]
        files: ^apps/cloudflare/.*\.(js|jsx|ts|tsx|css|mts)$
        pass_filenames: false
      - id: cloudflare-eslint
        name: cloudflare app ESLint
        entry: pnpm --dir apps/cloudflare lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/cloudflare/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: cloudflare-typecheck
        name: cloudflare app TypeScript
        entry: pnpm --dir apps/cloudflare typecheck
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/cloudflare/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: markdownlint
        name: markdown lint
        entry: npx --yes markdownlint-cli2@0.23.3
        language: system
        types: [markdown]
        files: ^(README\.md|docs/json-contract\.md|apps/cloudflare/README\.md)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--select=E4,E7,E9]
