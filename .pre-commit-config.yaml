minimum_pre_commit_version: "4.7.0"
default_language_version:
  python: python3.12
default_stages: [pre-commit]

exclude: |
  (?x)^(
    \.git/.*|
    .*\.lock$|
    .*pnpm-lock\.yaml|
    apps/(erp|pdv)/\.vscode/.*|
    apps/(erp|pdv)/src/routeTree\.gen\.ts|
    apps/api/worker-configuration\.d\.ts|
    packages/ui/src/fonts/.*/OFL\.txt|
    \.env.*|
    \.venv/.*|
    (^|/)node_modules/.*|
    (^|/)dist/.*|
    (^|/)build/.*|
    (^|/)coverage/.*|
    (^|/)\.wrangler/.*|
    (^|/)__pycache__/.*|
    .*\.mjs$
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: python-compileall
        name: Python syntax (compileall)
        entry: uv run python -m compileall -q
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint (uv)
        entry: uv run ruff check --no-cache --fix --select=E4,E7,E9 --ignore=E701,E702
        language: system
        types: [python]
      - id: prettier
        name: Prettier (version pinned)
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.10]
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        files: ^(apps/(erp|pdv|api)/(src|test)/|packages/(ui|pdv-sync)/(src|test)/|scripts/).+\.(js|jsx|ts|tsx|mjs|cjs|mts|css)$
        exclude: (^|/)routeTree\.gen\.ts$|(^|/)worker-configuration\.d\.ts$
      - id: ui-lint
        name: Shared UI ESLint
        entry: pnpm lint:ui
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^packages/ui/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: erp-lint
        name: ERP ESLint
        entry: pnpm lint:erp
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/erp/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: pdv-lint
        name: PDV ESLint
        entry: pnpm lint:pdv
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/pdv/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: sync-lint
        name: Shared PDV contract ESLint
        entry: pnpm lint:sync
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^packages/pdv-sync/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: api-lint
        name: API ESLint
        entry: pnpm lint:api
        language: system
        types_or: [javascript, ts]
        files: ^apps/api/.*\.(js|mjs|ts)$
        pass_filenames: false
      - id: markdownlint
        name: Markdown lint
        entry: pnpm lint:docs
        language: system
        types: [markdown]
        files: ^(AGENTS\.md|README\.md|docs/.*\.md|apps/(erp|pdv|api)/README\.md)$
        pass_filenames: false
      - id: svg-optimization
        name: SVG optimization and brand asset generation (uv)
        entry: uv run python scripts/optimize_svg_files.py --pre-commit
        language: system
        types: [file]
        files: \.svg$
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
