minimum_pre_commit_version: "4.7.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: erp-format
        name: ERP formatting
        entry: pnpm format:check:erp
        language: system
        types_or: [javascript, jsx, ts, tsx, css]
        files: ^apps/erp/.*\.(js|jsx|ts|tsx|css|mts)$
        pass_filenames: false
      - id: erp-lint
        name: ERP ESLint
        entry: pnpm lint:erp
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/erp/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: pdv-format
        name: PDV formatting
        entry: pnpm format:check:pdv
        language: system
        types_or: [javascript, jsx, ts, tsx, css]
        files: ^apps/pdv/.*\.(js|jsx|ts|tsx|css|mts)$
        pass_filenames: false
      - id: pdv-lint
        name: PDV ESLint
        entry: pnpm lint:pdv
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^apps/pdv/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
      - id: api-format
        name: API formatting
        entry: pnpm format:check:api
        language: system
        types_or: [javascript, ts]
        files: ^apps/api/.*\.(js|mjs|ts|json|jsonc)$
        pass_filenames: false
      - id: api-lint
        name: API ESLint
        entry: pnpm lint:api
        language: system
        types_or: [javascript, ts]
        files: ^apps/api/.*\.(js|mjs|ts)$
        pass_filenames: false
      - id: markdownlint
        name: markdown lint
        entry: pnpm lint:docs
        language: system
        types: [markdown]
        files: ^(AGENTS\.md|README\.md|docs/(json-contract|arquitetura-web)\.md|apps/(erp|pdv|api)/README\.md)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--select=E4,E7,E9]
        files: ^(src/sabores|tests)/.*\.py$
