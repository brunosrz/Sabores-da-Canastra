[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabores-da-canastra"
version = "0.1.0"
description = "App desktop local de custos e livro-caixa do Sabores da Canastra"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[project.scripts]
sabores = "sabores.cli:main"
sabores-desktop = "sabores.desktop:main"
sabores-pdv = "sabores.pos:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
