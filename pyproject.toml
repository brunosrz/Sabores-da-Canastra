[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sabores-da-canastra"
version = "0.1.0"
description = "Motor local de custos e planejamento para Sabores da Canastra"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sabores = "sabores.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
